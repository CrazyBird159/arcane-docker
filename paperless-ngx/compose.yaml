# Docker Compose file for running paperless from the Docker Hub.
# This file contains everything paperless needs to run.
# Paperless supports amd64, arm and arm64 hardware.
#
# All compose files of paperless configure paperless in the following way:
#
# - Paperless is (re)started on system boot, if it was running before shutdown.
# - Docker volumes for storing data are managed by Docker.
# - Folders for importing and exporting files are created in the same directory
#   as this file and mounted to the correct folders inside the container.
# - Paperless listens on port 8010.
#
# In addition to that, this Docker Compose file adds the following optional
# configurations:
#
# - Instead of SQLite (default), der zentrale postgres-central Container wird als Datenbankserver genutzt.
#
# To install and update paperless with this file, do the following:
#
# - Open portainer Stacks list and click 'Add stack'
# - Paste the contents of this file and assign a name, e.g. 'paperless'
# - Upload 'docker-compose.env' by clicking on 'Load variables from .env file'
# - Modify the environment variables as needed
# - Click 'Deploy the stack' and wait for it to be deployed
#
# For more extensive installation and update instructions, refer to the
# documentation.
networks:
  paperless-ngx:
    name: paperless-ngx
    driver: bridge
    ipam:
      config:
        - subnet: "172.28.0.0/24"
  shared-postgres:
    name: shared-postgres
    external: true


services:
  paperless-broker:
    image: docker.io/library/redis:8
    container_name: paperless-ngx-broker
    restart: unless-stopped
    networks:
      - paperless-ngx
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    depends_on:
      paperless-broker:
        condition: service_healthy
    ports:
      - "8010:8000"
    networks:
      - paperless-ngx
      - shared-postgres
    volumes:
      - /docker/paperless-ngx/data:/usr/src/paperless/data
      - /docker/paperless-ngx/media:/usr/src/paperless/media
      - /docker/paperless-ngx/export:/usr/src/paperless/export
      - /docker/paperless-ngx/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: postgres-central
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
    env_file:
      - stack.env
volumes:
  data:
  media:
  redisdata: