# Docker Compose Datei für Immich (Self-hosted Foto-/Video-Backup).
# Quelle: https://docs.immich.app/install/docker-compose/
#
# Immich benötigt zwingend eine Postgres-Instanz mit vorinstallierter
# Vector-Extension (VectorChord/pgvector) für Smart Search & Gesichtserkennung.
# Das ist KEIN Standard-Postgres-Image (siehe postgres_docker-compose.yaml) -
# daher bekommt Immich hier eine eigene, dedizierte Postgres-Instanz auf Basis
# des offiziellen ghcr.io/immich-app/postgres Images.
#
# To install and update Immich with this file, do the following:
#
# - Open portainer Stacks list and click 'Add stack'
# - Paste the contents of this file and assign a name, e.g. 'immich'
# - Upload 'immich.stack.env' by clicking on 'Load variables from .env file'
# - Modify the environment variables as needed
# - Click 'Deploy the stack' and wait for it to be deployed
networks:
  immich:
    name: immich
    driver: bridge
    ipam:
      config:
        - subnet: "172.34.0.0/24"

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: unless-stopped
    ports:
      - "8020:2283"
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # Externe Bibliothek (bereits vorhandene Fotos auf dem Host, read-only einbinden).
      # Pfad danach in der Immich-UI unter Administration > Externe Bibliotheken
      # mit dem Container-Pfad /mnt/media/Bilder hinzufügen.
      - ${EXTERNAL_LIBRARY_LOCATION}:/mnt/media/Bilder:ro
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: immich-redis
    networks:
      - immich
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:2283/api/server/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    networks:
      - immich

  immich-redis:
    image: valkey/valkey:8-bookworm
    container_name: immich-redis
    restart: unless-stopped
    volumes:
      - immich-redis-data:/data
    networks:
      - immich
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # DB_STORAGE_TYPE: "HDD"  # aktivieren, falls die DB nicht auf SSD liegt
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    networks:
      - immich
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=${DB_DATABASE_NAME} --username=${DB_USERNAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  model-cache:
  immich-redis-data: