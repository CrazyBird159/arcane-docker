networks:
  vaultwarden:
    name: vaultwarden
    driver: bridge
    ipam:
      config:
        - subnet: "172.24.0.0/24"

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      DOMAIN: "https://vw.kastellan.de"
      SIGNUPS_ALLOWED: "false"
      #ADMIN_TOKEN: "$$argon2id$$v=19$$m=65540,t=3,p=4$$VHdKSkFHb1k4OHp2bVYxNTRjTGZhazdFWkRFRDA3WXRYQ3JwZGZlMUplQT0$$paFa0Z7D7GZ9P4zf4egEt6KA/iPzxsaRApm23H+1kFI"
      SMTP_DEBUG: false
    volumes:
      - /docker/vaultwarden/vw-data/:/data/
    ports:
      - 82:80
    networks:
      - vaultwarden